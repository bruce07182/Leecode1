name: Refactor source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split index and build standalone release
        run: python tools/refactor_index.py
      - name: Commit refactored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.css assets/app.js dist/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refactor app into maintainable source files"
          git push
