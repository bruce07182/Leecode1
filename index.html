<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Building Blocks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
body{font-family:system-ui;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}textarea{width:100%;height:300px;font:15px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.45;padding:12px;box-sizing:border-box;tab-size:4}button,select{padding:10px 15px;margin:6px 6px 6px 0}pre{white-space:pre-wrap;background:#101827;color:#eee;padding:14px;border-radius:10px}.muted{color:#687386}.status{font-size:13px;color:#687386}.passed{color:#16803a;font-weight:700}.review{display:none;background:#eef8f0;color:#172033;border:1px solid #b9dfc3}.history{font-size:14px;line-height:1.5}
</style></head>
<body><div class="wrap"><h1>Python Building Blocks</h1><p class="muted">Small skills → combinations → LeetCode-style problems.</p><div class="card"><input id="email" type="email" placeholder="Email" style="padding:9px"><input id="password" type="password" placeholder="Password" style="padding:9px"><button id="loginBtn">Sign in</button><button id="signupBtn">Create account</button><button id="logoutBtn" style="display:none">Sign out</button><span id="cloudState" class="status">Local only</span></div>
<div class="card"><select id="q"></select><h2 id="title"></h2><p id="desc"></p><pre id="sig"></pre></div>
<div class="card"><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div class="status">Enter auto-indents • Tab inserts 4 spaces • Shift+Tab unindents</div><button id="runBtn">Run tests</button><button id="hintBtn">Hint</button><button id="resetBtn">Reset code</button><button id="reviewBtn" class="review">Prepare AI Review</button><pre id="out">Loading Python…</pre><div id="progress" class="status"></div><div id="history" class="history"></div></div></div>
<script>
const qs=[
{title:"1. Count positives",desc:"Return how many values in nums are greater than 0.",sig:"def count_positive(nums):",starter:"def count_positive(nums):\n    # your code\n    pass",fn:"count_positive",tests:[[[1,-2,3,0],2],[[-1,-2],0],[[1,2,3],3]],hint:"Use a counter and a for loop."},
{title:"2. Frequency map",desc:"Return a dictionary mapping each value to how many times it occurs.",sig:"def frequency(nums):",starter:"def frequency(nums):\n    # your code\n    pass",fn:"frequency",tests:[[[1,2,2],{1:1,2:2}],[[],{}],[[3,3,3],{3:3}]],hint:"Start with {}. For every value, increase its count."},
{title:"3. Contains duplicate",desc:"Return True if any value appears more than once.",sig:"def contains_duplicate(nums):",starter:"def contains_duplicate(nums):\n    # your code\n    pass",fn:"contains_duplicate",tests:[[[1,2,3],false],[[1,2,1],true],[[],false]],hint:"A set can remember values you have already seen."},
{title:"4. Find maximum",desc:"Return the largest value without using max(). Assume nums is non-empty.",sig:"def find_max(nums):",starter:"def find_max(nums):\n    # your code\n    pass",fn:"find_max",tests:[[[3,1,8,2],8],[[-5,-2,-9],-2],[[7],7]],hint:"Start with the first value as your best answer, then scan the rest."},
{title:"5. Two Sum",desc:"Return indices [i, j] where nums[i] + nums[j] == target. Exactly one answer exists.",sig:"def two_sum(nums, target):",starter:"def two_sum(nums, target):\n    # your code\n    pass",fn:"two_sum",args:true,tests:[[[[2,7,11,15],9],[0,1]],[[[3,2,4],6],[1,2]],[[[3,3],6],[0,1]]],hint:"Store each number's index in a dictionary. For x, look for target - x."},
{title:"6. Valid parentheses",desc:"Return True when (), [] and {} are correctly matched and nested.",sig:"def valid_parentheses(s):",starter:"def valid_parentheses(s):\n    # your code\n    pass",fn:"valid_parentheses",tests:[[["()[]{}"],true],[["([{}])"],true],[["(]"],false],[["([)]"],false]],hint:"Use a stack. Opening brackets go in; closing brackets must match the top."},
{title:"7. Binary search",desc:"Return the index of target in sorted nums, or -1 if it is absent.",sig:"def binary_search(nums, target):",starter:"def binary_search(nums, target):\n    # your code\n    pass",fn:"binary_search",args:true,tests:[[[[-1,0,3,5,9,12],9],4],[[[-1,0,3,5,9,12],2],-1],[[[5],5],0]],hint:"Keep left and right indexes. Check the middle and discard half each step."}
];
let py,idx=0,user=null,syncTimer=null;
const db=supabase.createClient("https://eylaymrbyjjbvkgebvzv.supabase.co","sb_publishable_SXbGa-hEOpxjEpk3bvsJEw_AByTO9I9");
const sel=document.getElementById("q"),code=document.getElementById("code"),out=document.getElementById("out"),titleEl=document.getElementById("title"),descEl=document.getElementById("desc"),sigEl=document.getElementById("sig");
qs.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=x.title;sel.appendChild(o)});
function load(){idx=+sel.value;const x=qs[idx];titleEl.textContent=x.title;descEl.textContent=x.desc;sigEl.textContent=x.sig;code.value=localStorage.getItem("bb"+idx)||x.starter;renderProgress()}
function getHistory(i){try{return JSON.parse(localStorage.getItem("bb_history_"+i)||"[]")}catch{return[]}}
function renderProgress(){const h=getHistory(idx),passed=h.filter(x=>x.passed);document.getElementById("progress").innerHTML=passed.length?'<span class="passed">✓ Completed</span> • '+passed.length+' passing run'+(passed.length>1?'s':''):'Not completed yet';document.getElementById("reviewBtn").style.display=passed.length?"inline-block":"none";document.getElementById("history").innerHTML=h.length?'<b>Recent attempts</b><br>'+h.slice(-5).reverse().map(a=>(a.passed?'✅':'❌')+' '+new Date(a.time).toLocaleString()).join('<br>'):''}
function saveAttempt(passed){const h=getHistory(idx);h.push({time:new Date().toISOString(),passed,code:code.value});localStorage.setItem("bb_history_"+idx,JSON.stringify(h.slice(-20)));renderProgress();queueCloud()}
async function saveCloud(){if(!user)return;document.getElementById("cloudState").textContent="Saving…";const {error}=await db.from("solutions").upsert({user_id:user.id,problem_id:idx,code:code.value,history:getHistory(idx),updated_at:new Date().toISOString()},{onConflict:"user_id,problem_id"});document.getElementById("cloudState").textContent=error?"Cloud save failed":"☁ Synced"}
async function loadCloud(){if(!user)return;document.getElementById("cloudState").textContent="Syncing…";const {data,error}=await db.from("solutions").select("code,history").eq("user_id",user.id).eq("problem_id",idx).maybeSingle();if(error){document.getElementById("cloudState").textContent="Cloud error";return}if(data){if(data.code){code.value=data.code;localStorage.setItem("bb"+idx,data.code)}if(data.history){localStorage.setItem("bb_history_"+idx,JSON.stringify(data.history));renderProgress()}}else await saveCloud();document.getElementById("cloudState").textContent="☁ Synced"}
function queueCloud(){if(!user)return;clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,800)}
sel.onchange=()=>{load();loadCloud()};code.oninput=()=>{localStorage.setItem("bb"+idx,code.value);queueCloud()};load();
async function setUser(u){user=u;document.getElementById("loginBtn").style.display=u?"none":"inline-block";document.getElementById("signupBtn").style.display=u?"none":"inline-block";document.getElementById("email").style.display=u?"none":"inline-block";document.getElementById("password").style.display=u?"none":"inline-block";document.getElementById("logoutBtn").style.display=u?"inline-block":"none";document.getElementById("cloudState").textContent=u?"☁ "+u.email:"Local only";if(u)await loadCloud()}
function credentials(){return {email:document.getElementById("email").value.trim(),password:document.getElementById("password").value}}
document.getElementById("loginBtn").onclick=async()=>{const {email,password}=credentials();if(!email||!password){out.textContent="Enter email and password.";return}const {error}=await db.auth.signInWithPassword({email,password});out.textContent=error?"Sign-in error: "+error.message:"Signed in. Cloud sync is active."}
document.getElementById("signupBtn").onclick=async()=>{const {email,password}=credentials();if(!email||password.length<6){out.textContent="Enter an email and a password of at least 6 characters.";return}const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error){out.textContent="Account error: "+error.message;return}out.textContent=data.session?"Account created and signed in.":"Account created. Supabase may require one confirmation email before first sign-in."}
document.getElementById("logoutBtn").onclick=()=>db.auth.signOut();
db.auth.getSession().then(({data})=>setUser(data.session?.user||null));db.auth.onAuthStateChange((_e,session)=>setUser(session?.user||null));
code.addEventListener("keydown",e=>{
 const start=code.selectionStart,end=code.selectionEnd,v=code.value;
 if(e.key==="Tab"){e.preventDefault();if(e.shiftKey){const ls=v.lastIndexOf("\n",start-1)+1;const before=v.slice(ls,start);const n=before.startsWith("    ")?4:before.startsWith("\t")?1:0;if(n){code.value=v.slice(0,ls)+v.slice(ls+n);code.selectionStart=code.selectionEnd=start-n}}else{code.setRangeText("    ",start,end,"end")}code.dispatchEvent(new Event("input"));return}
 if(e.key==="Enter"){e.preventDefault();const ls=v.lastIndexOf("\n",start-1)+1,line=v.slice(ls,start),indent=(line.match(/^\s*/)||[""])[0];const extra=line.trimEnd().endsWith(":")?"    ":"";code.setRangeText("\n"+indent+extra,start,end,"end");code.dispatchEvent(new Event("input"))}
});
loadPyodide().then(x=>{py=x;out.textContent="Ready."}).catch(e=>out.textContent="Could not load Python: "+e);
document.getElementById("hintBtn").onclick=()=>out.textContent=qs[idx].hint;
document.getElementById("resetBtn").onclick=()=>{localStorage.removeItem("bb"+idx);code.value=qs[idx].starter;out.textContent="Code reset.";queueCloud()};
document.getElementById("runBtn").onclick=run;
document.getElementById("reviewBtn").onclick=()=>{const x=qs[idx];const prompt="Review this Python LeetCode practice solution. Do not just rewrite it. Explain correctness, time/space complexity, Python style, edge cases, the DS&A building block demonstrated, and one concrete improvement or next practice step.\n\nProblem: "+x.desc+"\nSignature: "+x.sig+"\n\nSolution:\n"+code.value;navigator.clipboard.writeText(prompt).then(()=>out.textContent="AI review prompt copied. Paste it into ChatGPT for review.").catch(()=>out.textContent=prompt)};
function pyLiteral(x){return JSON.stringify(x).replace(/true/g,"True").replace(/false/g,"False").replace(/null/g,"None")}
async function run(){if(!py){out.textContent="Python is still loading…";return}const x=qs[idx];out.textContent="Running…";try{
 await py.runPythonAsync(code.value);
 if(!py.runPython("globals().__contains__('"+x.fn+"')")){out.textContent="❌ Function not found.\n\nExpected: "+x.sig+"\nCheck the function name in your def statement.";return}
 const lines=[];for(let i=0;i<x.tests.length;i++){const [input,exp]=x.tests[i];const call=x.args?x.fn+"("+input.map(pyLiteral).join(",")+")":x.fn+"("+pyLiteral(input)+")";const got=py.runPython(call);let js=got&&got.toJs?got.toJs({dict_converter:Object.fromEntries}):got;if(got&&got.destroy)got.destroy();const ok=JSON.stringify(js)===JSON.stringify(exp);lines.push("Test "+(i+1)+": "+(ok?"✅":"❌")+"  expected "+JSON.stringify(exp)+", got "+JSON.stringify(js))}
 const passed=lines.every(x=>x.includes("✅"));out.textContent=lines.join("\n")+(passed?"\n\n🎉 All tests passed. AI Review is now available.":"");saveAttempt(passed);
}catch(e){const s=String(e);out.textContent="❌ "+s.split("\n").slice(-4).join("\n")}}
</script></body></html>
