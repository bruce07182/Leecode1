const qs=[
{title:"1. Count positives",category:"Arrays / Loops",difficulty:"Easy",deps:[],sample:"def count_positive(nums):\n    count = 0\n    for x in nums:\n        if x > 0:\n            count += 1\n    return count",desc:"Return how many values in nums are greater than 0.",sig:"def count_positive(nums):",starter:"def count_positive(nums):\n    # your code\n    pass",fn:"count_positive",tests:[[[1,-2,3,0],2],[[-1,-2],0],[[1,2,3],3]],hint:"Use a counter and a for loop."},
{title:"2. Frequency map",category:"Hash Map",difficulty:"Easy",deps:[0],sample:"def frequency(nums):\n    counts = {}\n    for x in nums:\n        counts[x] = counts.get(x, 0) + 1\n    return counts",desc:"Return a dictionary mapping each value to how many times it occurs.",sig:"def frequency(nums):",starter:"def frequency(nums):\n    # your code\n    pass",fn:"frequency",tests:[[[1,2,2],{1:1,2:2}],[[],{}],[[3,3,3],{3:3}]],hint:"Start with {}. For every value, increase its count."},
{title:"3. Contains duplicate",category:"Hash Set",difficulty:"Easy",deps:[1],sample:"def contains_duplicate(nums):\n    seen = set()\n    for x in nums:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False",desc:"Return True if any value appears more than once.",sig:"def contains_duplicate(nums):",starter:"def contains_duplicate(nums):\n    # your code\n    pass",fn:"contains_duplicate",tests:[[[1,2,3],false],[[1,2,1],true],[[],false]],hint:"A set can remember values you have already seen."},
{title:"4. Find maximum",category:"Arrays / Scanning",difficulty:"Easy",deps:[0],sample:"def find_max(nums):\n    best = nums[0]\n    for x in nums[1:]:\n        if x > best:\n            best = x\n    return best",desc:"Return the largest value without using max(). Assume nums is non-empty.",sig:"def find_max(nums):",starter:"def find_max(nums):\n    # your code\n    pass",fn:"find_max",tests:[[[3,1,8,2],8],[[-5,-2,-9],-2],[[7],7]],hint:"Start with the first value as your best answer, then scan the rest."},
{title:"5. Two Sum",category:"Advanced Hash Map",difficulty:"Medium",deps:[2],sample:"def two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        need = target - x\n        if need in seen:\n            return [seen[need], i]\n        seen[x] = i",desc:"Return indices [i, j] where nums[i] + nums[j] == target. Exactly one answer exists.",sig:"def two_sum(nums, target):",starter:"def two_sum(nums, target):\n    # your code\n    pass",fn:"two_sum",args:true,tests:[[[[2,7,11,15],9],[0,1]],[[[3,2,4],6],[1,2]],[[[3,3],6],[0,1]]],hint:"Store each number's index in a dictionary. For x, look for target - x."},
{title:"6. Valid parentheses",category:"Stack",difficulty:"Easy",deps:[2],sample:"def valid_parentheses(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif not stack or stack.pop() != pairs[ch]:\n            return False\n    return not stack",desc:"Return True when (), [] and {} are correctly matched and nested.",sig:"def valid_parentheses(s):",starter:"def valid_parentheses(s):\n    # your code\n    pass",fn:"valid_parentheses",tests:[[["()[]{}"],true],[["([{}])"],true],[["(]"],false],[["([)]"],false]],hint:"Use a stack. Opening brackets go in; closing brackets must match the top."},
{title:"7. Binary search",category:"Binary Search",difficulty:"Easy",deps:[3],sample:"def binary_search(nums, target):\n    left, right = 0, len(nums) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1",desc:"Return the index of target in sorted nums, or -1 if it is absent.",sig:"def binary_search(nums, target):",starter:"def binary_search(nums, target):\n    # your code\n    pass",fn:"binary_search",args:true,tests:[[[[-1,0,3,5,9,12],9],4],[[[-1,0,3,5,9,12],2],-1],[[[5],5],0]],hint:"Keep left and right indexes. Check the middle and discard half each step."},
{title:"8. Reverse string",category:"Strings",difficulty:"Easy",deps:[0],sample:"def reverse_string(s):\n    return s[::-1]",desc:"Return s reversed.",sig:"def reverse_string(s):",starter:"def reverse_string(s):\n    # your code\n    pass",fn:"reverse_string",tests:[[["abc"],"cba"],[[""],""],[["a"],"a"]],hint:"Think about traversing from the end, or Python slicing."},
{title:"9. Palindrome",category:"Two Pointers",difficulty:"Easy",deps:[7],sample:"def is_palindrome(s):\n    left, right = 0, len(s)-1\n    while left < right:\n        if s[left] != s[right]: return False\n        left += 1; right -= 1\n    return True",desc:"Return True if s reads the same forward and backward.",sig:"def is_palindrome(s):",starter:"def is_palindrome(s):\n    # your code\n    pass",fn:"is_palindrome",tests:[[["racecar"],true],[["hello"],false],[[""],true]],hint:"Use one pointer at each end and move inward."},
{title:"10. Merge sorted arrays",category:"Two Pointers",deps:[8],sample:"def merge_sorted(a, b):\n    i=j=0; out=[]\n    while i<len(a) and j<len(b):\n        if a[i] <= b[j]: out.append(a[i]); i+=1\n        else: out.append(b[j]); j+=1\n    return out+a[i:]+b[j:]",desc:"Merge two sorted lists into one sorted list.",sig:"def merge_sorted(a, b):",starter:"def merge_sorted(a, b):\n    # your code\n    pass",fn:"merge_sorted",args:true,tests:[[[[1,3,5],[2,4]],[1,2,3,4,5]],[[[],[1]],[1]],[[[2],[1]],[1,2]]],hint:"Keep one index for each list."},
{title:"11. Min stack",category:"Stack",deps:[5],sample:"def min_stack(ops):\n    stack=[]; mins=[]; out=[]\n    for op,x in ops:\n        if op=='push': stack.append(x); mins.append(x if not mins else min(x,mins[-1]))\n        elif op=='pop': stack.pop(); mins.pop()\n        else: out.append(mins[-1])\n    return out",desc:"Process [operation,value] pairs. push adds, pop removes, min records the current minimum. Return all recorded minimums.",sig:"def min_stack(ops):",starter:"def min_stack(ops):\n    # your code\n    pass",fn:"min_stack",tests:[[[["push",3],["push",1],["min",0],["pop",0],["min",0]],[1,3]],[[["push",5],["min",0]],[5]]],hint:"Maintain a second stack containing the minimum so far."},
{title:"12. First unique char",category:"Hash Map",deps:[4,7],sample:"def first_unique(s):\n    count={}\n    for ch in s: count[ch]=count.get(ch,0)+1\n    for i,ch in enumerate(s):\n        if count[ch]==1: return i\n    return -1",desc:"Return the index of the first character that appears exactly once, or -1.",sig:"def first_unique(s):",starter:"def first_unique(s):\n    # your code\n    pass",fn:"first_unique",tests:[[["leetcode"],0],[["loveleetcode"],2],[["aabb"],-1]],hint:"Count first, then scan again."},
{title:"13. Lower bound",category:"Binary Search",deps:[6],sample:"def lower_bound(nums,target):\n    l,r=0,len(nums)\n    while l<r:\n        m=(l+r)//2\n        if nums[m] < target: l=m+1\n        else: r=m\n    return l",desc:"Return the first index where target could be inserted without breaking sorted order.",sig:"def lower_bound(nums, target):",starter:"def lower_bound(nums, target):\n    # your code\n    pass",fn:"lower_bound",args:true,tests:[[[[1,3,3,5],3],1],[[[1,3,5],4],2],[[[],2],0]],hint:"Binary search for a boundary, not an exact match."},
{title:"14. Fibonacci memo",category:"Recursion / DP",difficulty:"Medium",deps:[6],sample:"def fib(n):\n    memo={0:0,1:1}\n    def f(x):\n        if x not in memo: memo[x]=f(x-1)+f(x-2)\n        return memo[x]\n    return f(n)",desc:"Return the nth Fibonacci number using recursion with memoization.",sig:"def fib(n):",starter:"def fib(n):\n    # your code\n    pass",fn:"fib",tests:[[0,0],[1,1],[7,13],[10,55]],hint:"Cache answers so each n is solved only once."},
{title:"15. Tree max depth",category:"Trees / DFS",difficulty:"Medium",deps:[13],sample:"def tree_depth(tree):\n    if tree is None: return 0\n    value,left,right=tree\n    return 1+max(tree_depth(left),tree_depth(right))",desc:"A tree node is [value,left,right], with None for empty. Return maximum depth.",sig:"def tree_depth(tree):",starter:"def tree_depth(tree):\n    # your code\n    pass",fn:"tree_depth",tests:[[[1,[2,null,null],[3,null,null]],2],[null,0],[[1,[2,[3,null,null],null],null],3]],hint:"Depth = 1 + the larger depth of the two children."},
{title:"16. Tree level order",category:"Trees / BFS",difficulty:"Medium",deps:[14],sample:"def level_order(tree):\n    if tree is None: return []\n    q=[tree]; out=[]\n    while q:\n        node=q.pop(0); out.append(node[0])\n        if node[1]: q.append(node[1])\n        if node[2]: q.append(node[2])\n    return out",desc:"Return tree values in breadth-first (level) order.",sig:"def level_order(tree):",starter:"def level_order(tree):\n    # your code\n    pass",fn:"level_order",tests:[[[1,[2,null,null],[3,null,null]],[1,2,3]],[null,[]],[[1,[2,[4,null,null],null],[3,null,null]],[1,2,3,4]]],hint:"Use a queue: remove from the front and add children to the back."},
{title:"17. K largest",category:"Heap",difficulty:"Medium",deps:[11],sample:"def k_largest(nums,k):\n    import heapq\n    return sorted(heapq.nlargest(k,nums), reverse=True)",desc:"Return the k largest values in descending order.",sig:"def k_largest(nums, k):",starter:"def k_largest(nums, k):\n    # your code\n    pass",fn:"k_largest",args:true,tests:[[[[3,2,1,5,6,4],2],[6,5]],[[[1],1],[1]],[[[4,4,2],2],[4,4]]],hint:"Python heapq can maintain or retrieve the largest k values."},
{title:"18. Graph BFS",category:"Graphs / BFS",difficulty:"Medium",deps:[15],sample:"def bfs(graph,start):\n    q=[start]; seen={start}; out=[]\n    while q:\n        x=q.pop(0); out.append(x)\n        for y in graph.get(x,[]):\n            if y not in seen: seen.add(y); q.append(y)\n    return out",desc:"Given an adjacency dictionary and start node, return nodes in BFS visit order.",sig:"def bfs(graph, start):",starter:"def bfs(graph, start):\n    # your code\n    pass",fn:"bfs",args:true,tests:[[[{"A":["B","C"],"B":["D"],"C":[],"D":[]},"A"],["A","B","C","D"]],[[{"A":[]},"A"],["A"]]],hint:"Queue + seen set. Mark a node seen when you enqueue it."},
{title:"19. Climbing stairs",category:"Dynamic Programming",difficulty:"Medium",deps:[13],sample:"def climb_stairs(n):\n    if n<=2: return n\n    a,b=1,2\n    for _ in range(3,n+1): a,b=b,a+b\n    return b",desc:"You may climb 1 or 2 steps. Return the number of distinct ways to reach step n.",sig:"def climb_stairs(n):",starter:"def climb_stairs(n):\n    # your code\n    pass",fn:"climb_stairs",tests:[[1,1],[2,2],[5,8],[8,34]],hint:"Ways(n) = Ways(n-1) + Ways(n-2)."},
{title:"20. Coin change",category:"Dynamic Programming",deps:[18],sample:"def coin_change(coins,amount):\n    dp=[amount+1]*(amount+1); dp[0]=0\n    for a in range(1,amount+1):\n        for c in coins:\n            if c<=a: dp[a]=min(dp[a],dp[a-c]+1)\n    return -1 if dp[amount]>amount else dp[amount]",desc:"Return the minimum number of coins needed to make amount, or -1.",sig:"def coin_change(coins, amount):",starter:"def coin_change(coins, amount):\n    # your code\n    pass",fn:"coin_change",args:true,tests:[[[[1,2,5],11],3],[[[2],3],-1],[[[1],0],0]],hint:"Let dp[a] be the best answer for amount a, built from smaller amounts."},
];
let py,idx=0,user=null,syncTimer=null;
const db=supabase.createClient("https://eylaymrbyjjbvkgebvzv.supabase.co","sb_publishable_SXbGa-hEOpxjEpk3bvsJEw_AByTO9I9");
const sel=document.getElementById("q"),code=document.getElementById("code"),out=document.getElementById("out"),titleEl=document.getElementById("title"),descEl=document.getElementById("desc"),sigEl=document.getElementById("sig");
qs.forEach((x,i)=>{const o=document.createElement("option");o.value=i;sel.appendChild(o)});
function completed(i){return getHistory(i).some(a=>a.passed)}
function isBasic(i){return (qs[i].difficulty||"Easy")==="Easy" && !["Advanced Hash Map","Two Pointers","Recursion / DP","Trees / DFS","Trees / BFS","Heap","Graphs / BFS","Dynamic Programming"].includes(qs[i].category)}
function modeAllows(i){return document.getElementById("mode").value==="all"||isBasic(i)}
function unlocked(i){return qs[i].deps.every(completed)}
function renderDashboard(){const cats={};qs.forEach((x,i)=>{if(!cats[x.category])cats[x.category]=[0,0];cats[x.category][1]++;if(completed(i))cats[x.category][0]++});document.getElementById("dashboard").innerHTML=Object.entries(cats).map(([c,v])=>'<div class="skill"><b>'+c+'</b><div>'+v[0]+'/'+v[1]+'</div><div class="bar"><div class="fill" style="width:'+(100*v[0]/v[1])+'%"></div></div></div>').join("");const n=qs.findIndex((x,i)=>unlocked(i)&&!completed(i));document.getElementById("nextUp").innerHTML=n>=0?'<span class="next">Next recommended:</span> '+qs[n].title+' · '+qs[n].category:'🎉 All available training completed.'}
function refreshOptions(){qs.forEach((x,i)=>{const o=sel.options[i],ok=unlocked(i)&&modeAllows(i);o.hidden=!modeAllows(i);o.disabled=!ok;o.textContent=(completed(i)?"✓ ":"")+x.title+(ok?"":" 🔒")});renderDashboard()}
function load(){idx=+sel.value;const x=qs[idx];titleEl.textContent=x.title;descEl.textContent=x.desc;sigEl.textContent=x.sig;document.getElementById("meta").innerHTML=(completed(idx)?'<span class="tag">'+x.category+'</span> ':'')+'<span class="difficulty">'+(x.difficulty||"Easy")+'</span>'+(x.deps.length?'<span class="status"> Requires: '+x.deps.map(d=>qs[d].title.replace(/^\\d+\\. /,"")).join(", ")+'</span>':'<span class="status"> Foundation</span>');code.value=localStorage.getItem("bb"+idx)||x.starter;renderProgress();refreshOptions()}
function getHistory(i){try{return JSON.parse(localStorage.getItem("bb_history_"+i)||"[]")}catch{return[]}}
function renderProgress(){const h=getHistory(idx),passed=h.filter(x=>x.passed),fails=h.filter(x=>!x.passed).length,hints=+(localStorage.getItem("bb_hints_"+idx)||0);const mastery=passed.length>=2&&hints===0?"Mastered":passed.length?"Learning":"New";document.getElementById("mastery").textContent="Mastery: "+mastery+" · attempts "+h.length+" · hints "+hints;document.getElementById("progress").innerHTML=passed.length?'<span class="passed">✓ Completed</span> • '+passed.length+' passing run'+(passed.length>1?'s':''):'Not completed yet';document.getElementById("reviewBtn").style.display=passed.length?"inline-block":"none";document.getElementById("sampleBtn").style.display=passed.length?"inline-block":"none";document.getElementById("history").innerHTML=h.length?'<b>Recent attempts</b><br>'+h.slice(-5).reverse().map(a=>(a.passed?'✅':'❌')+' '+new Date(a.time).toLocaleString()).join('<br>'):''}
function saveAttempt(passed){const h=getHistory(idx);h.push({time:new Date().toISOString(),passed,code:code.value});localStorage.setItem("bb_history_"+idx,JSON.stringify(h.slice(-20)));renderProgress();refreshOptions();queueCloud()}
async function saveCloud(){if(!user)return;document.getElementById("cloudState").textContent="Saving…";const {error}=await db.from("solutions").upsert({user_id:user.id,problem_id:idx,code:code.value,history:getHistory(idx),updated_at:new Date().toISOString()},{onConflict:"user_id,problem_id"});document.getElementById("cloudState").textContent=error?"Cloud save failed":"☁ Synced"}
async function syncAllCloud(){if(!user)return;const {data,error}=await db.from("solutions").select("problem_id,code,history").eq("user_id",user.id);if(error){document.getElementById("cloudState").textContent="Cloud error";return}for(const row of data||[]){if(row.code)localStorage.setItem("bb"+row.problem_id,row.code);if(row.history)localStorage.setItem("bb_history_"+row.problem_id,JSON.stringify(row.history))}refreshOptions();load()}
async function loadCloud(){if(!user)return;document.getElementById("cloudState").textContent="Syncing…";const {data,error}=await db.from("solutions").select("code,history").eq("user_id",user.id).eq("problem_id",idx).maybeSingle();if(error){document.getElementById("cloudState").textContent="Cloud error";return}if(data){if(data.code){code.value=data.code;localStorage.setItem("bb"+idx,data.code)}if(data.history){localStorage.setItem("bb_history_"+idx,JSON.stringify(data.history));renderProgress()}}else await saveCloud();document.getElementById("cloudState").textContent="☁ Synced"}
function queueCloud(){if(!user)return;clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,800)}
document.getElementById("mode").onchange=()=>{refreshOptions();const first=qs.findIndex((x,i)=>modeAllows(i)&&unlocked(i));if(first>=0&&!modeAllows(+sel.value)){sel.value=first;load();loadCloud()}};sel.onchange=()=>{load();loadCloud()};code.oninput=()=>{localStorage.setItem("bb"+idx,code.value);queueCloud()};load();
async function setUser(u){user=u;document.getElementById("loginBtn").style.display=u?"none":"inline-block";document.getElementById("signupBtn").style.display=u?"none":"inline-block";document.getElementById("email").style.display=u?"none":"inline-block";document.getElementById("password").style.display=u?"none":"inline-block";document.getElementById("logoutBtn").style.display=u?"inline-block":"none";document.getElementById("cloudState").textContent=u?"☁ "+(u.user_metadata?.nickname||u.email.split("@")[0]):"Local only";if(u)await syncAllCloud()}
document.getElementById("menuBtn").onclick=()=>document.getElementById("menuBox").classList.toggle("show");document.getElementById("progressBtn").onclick=()=>{document.getElementById("progressCard").classList.toggle("hidden");document.getElementById("menuBox").classList.remove("show")};
function credentials(){return {email:document.getElementById("email").value.trim(),password:document.getElementById("password").value}}
document.getElementById("loginBtn").onclick=async()=>{const {email,password}=credentials();if(!email||!password){out.textContent="Enter email and password.";return}const {error}=await db.auth.signInWithPassword({email,password});out.textContent=error?"Sign-in error: "+error.message:"Signed in. Cloud sync is active."}
document.getElementById("signupBtn").onclick=async()=>{const {email,password}=credentials();if(!email||password.length<6){out.textContent="Enter an email and a password of at least 6 characters.";return}const nickname=email.split("@")[0];const {data,error}=await db.auth.signUp({email,password,options:{data:{nickname},emailRedirectTo:location.origin+location.pathname}});if(error){out.textContent="Account error: "+error.message;return}out.textContent=data.session?"Account created and signed in.":"Account created. Supabase may require one confirmation email before first sign-in."}
document.getElementById("forgotBtn").onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email){out.textContent="Enter your email first.";return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});out.textContent=error?"Reset error: "+error.message:"Password reset email sent."}
document.getElementById("logoutBtn").onclick=()=>db.auth.signOut();
db.auth.getSession().then(({data})=>setUser(data.session?.user||null));db.auth.onAuthStateChange(async(e,session)=>{if(e==="PASSWORD_RECOVERY"){const p=prompt("Enter a new password (at least 6 characters):");if(p&&p.length>=6){const {error}=await db.auth.updateUser({password:p});out.textContent=error?"Password update failed: "+error.message:"Password updated."}}setUser(session?.user||null)});
code.addEventListener("keydown",e=>{
 const start=code.selectionStart,end=code.selectionEnd,v=code.value;
 if(e.key==="Tab"){e.preventDefault();if(e.shiftKey){const ls=v.lastIndexOf("\n",start-1)+1;const before=v.slice(ls,start);const n=before.startsWith("    ")?4:before.startsWith("\t")?1:0;if(n){code.value=v.slice(0,ls)+v.slice(ls+n);code.selectionStart=code.selectionEnd=start-n}}else{code.setRangeText("    ",start,end,"end")}code.dispatchEvent(new Event("input"));return}
 if(e.key==="Enter"){e.preventDefault();const ls=v.lastIndexOf("\n",start-1)+1,line=v.slice(ls,start),indent=(line.match(/^\s*/)||[""])[0];const extra=line.trimEnd().endsWith(":")?"    ":"";code.setRangeText("\n"+indent+extra,start,end,"end");code.dispatchEvent(new Event("input"))}
});
loadPyodide().then(x=>{py=x;out.textContent="Ready."}).catch(e=>out.textContent="Could not load Python: "+e);
document.getElementById("hintBtn").onclick=()=>{localStorage.setItem("bb_hints_"+idx,+(localStorage.getItem("bb_hints_"+idx)||0)+1);renderProgress();out.textContent=qs[idx].hint};
document.getElementById("resetBtn").onclick=()=>{localStorage.removeItem("bb"+idx);code.value=qs[idx].starter;out.textContent="Code reset.";queueCloud()};
document.getElementById("runBtn").onclick=run;
document.getElementById("sampleBtn").onclick=()=>{out.textContent="Sample answer:\n\n"+qs[idx].sample+"\n\nCompare the idea with yours; don't worry if your correct solution looks different."};
document.getElementById("reviewBtn").onclick=()=>{const x=qs[idx];const prompt="Review this Python LeetCode practice solution. Do not just rewrite it. Explain correctness, time/space complexity, Python style, edge cases, the DS&A building block demonstrated, and one concrete improvement or next practice step.\n\nProblem: "+x.desc+"\nSignature: "+x.sig+"\n\nSolution:\n"+code.value;navigator.clipboard.writeText(prompt).then(()=>out.textContent="AI review prompt copied. Paste it into ChatGPT for review.").catch(()=>out.textContent=prompt)};
function pyLiteral(x){return JSON.stringify(x).replace(/true/g,"True").replace(/false/g,"False").replace(/null/g,"None")}
async function run(){if(!py){out.textContent="Python is still loading…";return}const x=qs[idx];out.textContent="Running…";try{
 await py.runPythonAsync(code.value);
 if(!py.runPython("globals().__contains__('"+x.fn+"')")){out.textContent="❌ Function not found.\n\nExpected: "+x.sig+"\nCheck the function name in your def statement.";return}
 const lines=[];for(let i=0;i<x.tests.length;i++){const [input,exp]=x.tests[i];const call=x.args?x.fn+"("+input.map(pyLiteral).join(",")+")":x.fn+"("+pyLiteral(input)+")";const got=py.runPython(call);let js=got&&got.toJs?got.toJs({dict_converter:Object.fromEntries}):got;if(got&&got.destroy)got.destroy();const ok=JSON.stringify(js)===JSON.stringify(exp);lines.push("Test "+(i+1)+": "+(ok?"✅":"❌")+"  expected "+JSON.stringify(exp)+", got "+JSON.stringify(js))}
 const passed=lines.every(x=>x.includes("✅"));out.textContent=lines.join("\n")+(passed?"\n\n🎉 All tests passed. AI Review is now available.":"");saveAttempt(passed);
}catch(e){const s=String(e);out.textContent="❌ "+s.split("\n").slice(-4).join("\n")}}
